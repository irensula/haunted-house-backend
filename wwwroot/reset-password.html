<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - Haunted House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #171923;
            color: #f7fafc;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #252a3a;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #cbd5e0;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #4a5568;
            border-radius: 8px;
            background: #171923;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #8dd54f;
            color: #171923;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }
    </style>

</head>
<body>
    <main class="container">
        <h1>Reset password</h1>
        <p>Enter a new password for your Haunted House account</p>

        <form id="resetForm">
            <label for="password">New password</label>
            <input 
                type="password"
                id="password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm new password</label>
            <input 
                type="password"
                id="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required
            >
            <button type=""submit id="submitButton">Reset password</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        const form = document.getElementById("resetForm");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");

        // Get reset token from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            message.textContent = "Invalid or missing reset link.";
            form.style.display = "none";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const newPassword = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            submitButton.disabled = true;
            message.textContent = "Resetting password...";

            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Password reset failed."
                    );
                }

                message.textContent = "Password has been reset successfully. You can now log in.";

                form.reset();
                form.style.display = "none";

            } catch (error) {
                message.textContent = error.message;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
