services:
  postgres:
    image: postgres:17
    container_name: gamebackend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebackend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - gamebackend_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamebackend-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5237:8080"
    depends_on:
      - postgres

volumes:
  gamebackend_postgres_data: